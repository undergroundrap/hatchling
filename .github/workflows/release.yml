name: release

# Publishes every crate to crates.io when a GitHub release is published.
#
# Trusted publishing: each crate on crates.io trusts this workflow, in the
# `release` environment, and crates-io-auth-action trades the job's OIDC
# token for a short-lived publish token. No crates.io token is stored
# anywhere. The job has write access to crates.io, so every action is
# pinned to a commit.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release tag
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Rust
        # dtolnay/rust-toolchain, master as of 2026-09-12
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      # A release whose tag, workspace version and changelog disagree would
      # publish the wrong version, or one with no notes. Refuse it.
      - name: The tag, the workspace version and the changelog agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          grep -qx "version = \"$version\"" Cargo.toml || { echo "Cargo.toml's workspace version isn't $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no $version section"; exit 1; }

      - name: Get a short-lived crates.io token
        id: auth
        # rust-lang/crates-io-auth-action v1.0.5
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish every crate, dependencies first
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
