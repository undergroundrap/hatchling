name: release

# A version tag (vX.Y.Z) on a commit on main releases it:
#
#   - the released programs, built for x86_64 and aarch64 Linux with the
#     pinned toolchain and Cargo.lock's dependencies, each target twice, on
#     separate runners from different paths; the release goes out only if
#     the two builds are byte-identical;
#   - the app, built twice from different paths, released only if the two
#     builds are byte-identical: what hatchling-host serves;
#   - a CycloneDX SBOM per program and target, and SHA256SUMS;
#   - the installer (scripts/install.sh and packaging/) and
#     get-hatchling.sh, pinned to the tag, so a person installs with curl
#     alone (scripts/release-installer.sh; CI's service job installs with
#     them on every change);
#   - a Windows setup holding x86_64's programs, the app and the installer,
#     scanned with Microsoft Defender (installer/windows; it isn't compared
#     twice like the rest, and what it holds is);
#   - a build-provenance attestation for every file, so
#     `gh attestation verify <file> --repo undergroundrap/hatchling` checks it
#     was built here, by this workflow, from the tag;
#   - a GitHub release, with the version's CHANGELOG.md section as its notes;
#   - every crate on crates.io, through trusted publishing.
#
# Every other run (main, a pull request that changes how a release is
# built, or by hand) is a dry run: the same builds, comparison, SBOMs and
# notes, and nothing released.
#
# The jobs that build run third-party build scripts, so they hold no token
# that can write anything or sign. Attesting and releasing are a job of
# their own, from the builds' outputs. crates.io's token is a job's too, in
# the `release` environment, which crates.io trusts, and that job builds
# nothing: every crate is packaged and verified (built) in a job with no
# token first, and the token's job publishes with `--no-verify`. Every
# action is pinned to a commit. See docs/releasing.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/windows/**
      - scripts/release-*.sh
      - scripts/test_release_notes.py
      - scripts/publish-crates.sh
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - frontend/package-lock.json
      - frontend/scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  notes:
    name: release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The notes script's tests
        run: python3 -m unittest discover -s scripts -p 'test_release_notes.py' -v

      # A release whose tag, workspace version and changelog disagree would
      # ship the wrong version, or one with no notes; one from a commit
      # that isn't on main would ship what no review saw. Refuse both.
      - name: The tag is a version on main, and the changelog has its notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG isn't vX.Y.Z"; exit 1; }
          grep -qx "version = \"$version\"" Cargo.toml || { echo "Cargo.toml's workspace version isn't $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG's commit isn't on main"; exit 1; }
          bash scripts/release-notes.sh "$version" > notes.md

      - name: The newest version's notes (dry run)
        if: github.ref_type != 'tag'
        run: bash scripts/release-notes.sh --latest > notes.md

      - name: Upload the notes
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }} (${{ matrix.copy }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        # Two independent builds of each target: b is checked out at
        # another path, with a CARGO_HOME of its own.
        copy: [a, b]
        # Ubuntu 22.04's glibc (2.35), so the programs run on glibc 2.34 and
        # later: Debian 12, Ubuntu 22.04, RHEL 9. Linked against 2.39, the
        # standard library's process spawning needs 2.39's symbols.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ${{ matrix.copy == 'a' && 'hatchling' || 'elsewhere/second-build/hatchling' }}
          persist-credentials: false

      - name: Install Rust
        # dtolnay/rust-toolchain, master as of 2026-09-12
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install cargo-auditable
        run: |
          cargo install cargo-auditable --version 0.7.7 --locked --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: ${{ matrix.copy == 'a' && 'hatchling' || 'elsewhere/second-build/hatchling' }}
        env:
          COPY: ${{ matrix.copy }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$COPY" = b ]; then
            export CARGO_HOME="$RUNNER_TEMP/cargo-home-b"
            mkdir -p "$CARGO_HOME"
          fi
          bash scripts/release-artifacts.sh build "$RUNNER_TEMP/out"
          test -f "$RUNNER_TEMP/out/build-info-$TARGET.txt"

      - name: Upload the build
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-${{ matrix.target }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  ui:
    name: build the app (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Two independent builds: b is checked out at another path.
        copy: [a, b]
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ${{ matrix.copy == 'a' && 'hatchling' || 'elsewhere/second-build/hatchling' }}
          persist-credentials: false

      - name: Install Node
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Build the app
        working-directory: ${{ matrix.copy == 'a' && 'hatchling' || 'elsewhere/second-build/hatchling' }}
        run: bash scripts/release-artifacts.sh ui "$RUNNER_TEMP/out"

      - name: Upload the app
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-${{ matrix.copy }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  reproducible:
    name: reproducible builds
    needs: [build, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the builds
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: build-*
          path: builds

      - name: Download the app's builds
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ui-*
          path: builds

      # Each target's two builds hold the same files, byte for byte, and
      # every released program.
      - name: Each target's two builds are byte-identical
        run: |
          status=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            a="builds/build-$target-a"; b="builds/build-$target-b"
            diff <(cd "$a" && ls) <(cd "$b" && ls) || { echo "$target: the builds hold different files"; status=1; }
            [ "$(ls "$a" | grep -c -- "-$target\$")" = 5 ] || { echo "$target: not 5 programs"; status=1; }
            for file in "$a"/*-"$target"; do
              name=$(basename "$file")
              if cmp -s "$file" "$b/$name"; then
                echo "same       $(sha256sum < "$file" | cut -d' ' -f1)  $name"
              else
                echo "DIFFERENT  $name"; status=1
              fi
            done
            if [ "$status" != 0 ]; then
              diff "$a/build-info-$target.txt" "$b/build-info-$target.txt" || true
            fi
          done
          if cmp -s builds/ui-a/hatchling-ui.tar.gz builds/ui-b/hatchling-ui.tar.gz; then
            echo "same       $(sha256sum < builds/ui-a/hatchling-ui.tar.gz | cut -d' ' -f1)  hatchling-ui.tar.gz"
          else
            echo "DIFFERENT  hatchling-ui.tar.gz"; status=1
          fi
          exit $status

  sbom:
    name: SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust
        # dtolnay/rust-toolchain, master as of 2026-09-12
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install cargo-cyclonedx
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: One SBOM per program and target
        run: bash scripts/release-artifacts.sh sbom "$RUNNER_TEMP/sbom"

      - name: Upload the SBOMs
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error

  crates:
    name: crates verified
    # Every published crate, packaged as crates.io gets it and built from
    # that package, in dependency order: the build that `cargo publish`
    # would otherwise run where the publish token is.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust
        # dtolnay/rust-toolchain, master as of 2026-09-12
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Package and verify every published crate
        run: cargo publish --workspace --dry-run --locked

  windows-setup:
    name: Windows setup
    # What it holds has already been compared, byte for byte. It compiles
    # our own script over those files, with no token, and only the job that
    # releases attests it.
    needs: [reproducible]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download the first x86_64 build
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-x86_64-unknown-linux-gnu-a
          path: downloads/build

      - name: Download the app's first build
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-a
          path: downloads/ui

      - name: Name the setup's version
        shell: bash
        # The tag's, or on a dry run, the version a release would be.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no version in Cargo.toml"; exit 1; }
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Gather what the setup holds
        shell: bash
        run: |
          target=x86_64-unknown-linux-gnu
          mkdir setup-files
          for program in broker agent host browser; do
            cp "downloads/build/hatchling-$program-$target" setup-files/
          done
          cp downloads/ui/hatchling-ui.tar.gz setup-files/
          scripts/release-installer.sh setup-files "$TAG"
          (cd setup-files && sha256sum --text -- * | sed 's/ \*/  /' > SHA256SUMS && cat SHA256SUMS)
          [ "$(wc -l < setup-files/SHA256SUMS)" = 7 ] || { echo "expected 7 files"; exit 1; }

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build the setup
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DReleaseDir=$PWD\setup-files" "/DOutputDir=$PWD\out" "/DAppVersion=$version" installer\windows\hatchling.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out\*.exe | Format-List

      - name: Scan it with Microsoft Defender
        # A guess from Defender's model has called a setup a trojan: a build
        # it flags goes no further. A local scan isn't its cloud's verdict.
        shell: pwsh
        run: |
          $scanner = Get-ChildItem "C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $scanner) { $scanner = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" }
          $file = (Get-ChildItem out\*.exe | Select-Object -First 1).FullName
          & $scanner -SignatureUpdate | Out-Null
          & $scanner -Scan -ScanType 3 -File $file -DisableRemediation
          if ($LASTEXITCODE -ne 0) { Write-Host "Defender flagged $file"; exit 1 }

      - name: Keep the setup
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-setup
          path: out/*.exe
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [notes, reproducible, sbom, crates, windows-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the first build of each target
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: build-*-a
          path: downloads

      - name: Download the app's first build
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-a
          path: downloads/ui

      - name: Download the SBOMs
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sbom
          path: downloads/sbom

      - name: Download the Windows setup
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-setup
          path: downloads/windows

      - name: Download the notes
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: notes
          path: downloads/notes

      - name: Gather the release's files, and their SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp downloads/build-*-a/* downloads/sbom/* downloads/ui/* downloads/windows/* dist/
          # The installer and get-hatchling.sh, pinned to this tag: what a
          # person installs with, with no clone.
          scripts/release-installer.sh dist "$TAG"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          [ "$(wc -l < dist/SHA256SUMS)" = 26 ] || { echo "expected 26 files: 10 programs, 10 SBOMs, 2 build infos, the app, the Windows setup, the installer, get-hatchling.sh"; exit 1; }

      - name: Attest every file's provenance
        # actions/attest-build-provenance v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "Hatchling ${TAG#v}" --notes-file downloads/notes/notes.md dist/*

  publish:
    name: publish to crates.io
    if: github.ref_type == 'tag'
    needs: [release, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release tag
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust
        # dtolnay/rust-toolchain, master as of 2026-09-12
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - name: Get a short-lived crates.io token
        id: auth
        # rust-lang/crates-io-auth-action v1.0.5
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      # Dependencies first, skipping any crate already on crates.io at this
      # version, so a failed run can simply be re-run. A crate new to
      # crates.io is skipped and named in a warning: trusted publishing can't
      # create a crate, so it gets its first publish by hand. Nothing is
      # built here (`--no-verify`): the `crates` job verified every crate,
      # and no dependency's build script or macro runs beside the token.
      - name: Publish every crate, dependencies first, without building
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish-crates.sh --existing-only --no-verify
