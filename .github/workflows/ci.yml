name: gate

on:
  push:
    branches: [main]
    paths:
      # Run on everything except pure docs/assets pushes (saves minutes),
      # but always run when a machine-checked doc changes:
      # crates/hatchling-core/tests/local_api_doc.rs reads
      # docs/local-api.md, and hatchling-dev's arch check reads
      # docs/dependency-review.md and docs/arch/module-map.md.
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!assets/**'
      - 'docs/local-api.md'
      - 'docs/dependency-review.md'
      - 'docs/arch/module-map.md'
      - 'README.md'
      - 'docs/examples/**'
  # Every pull request, with no path filter: main requires these checks,
  # and a required check that never starts blocks the merge.
  pull_request:

# Read-only: the gate needs nothing more, and pull requests from forks run it.
permissions:
  contents: read

jobs:
  check:
    name: gate (${{ matrix.toolchain }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.98.1, 1.85.0]
    # The pinned toolchain (rust-toolchain.toml) and the MSRV, never a floating
    # `stable`: a newer compiler adds lints that `-D warnings` turns into errors
    # nobody changed code for. Bump the pin and this together.
    # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, so the MSRV job really
    # runs the gate at 1.85.0.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      # The real-kernel cell tests must run here, never skip.
      HATCHLING_REQUIRE_CELL: "1"
      HATCHLING_REQUIRE_CGROUP: "1"
      HATCHLING_TEST_CGROUP: /sys/fs/cgroup/hatchling-ci/cells
      # The browser cell's tests must run here too (WO-029), on the pinned
      # headless Chromium the next steps install.
      HATCHLING_REQUIRE_BROWSER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      # cargo-deny 0.20.2 needs rustc 1.88+ to *build*, so it cannot be
      # compiled in the MSRV job. Install the prebuilt release binary
      # instead: version-pinned, toolchain-independent, and fast.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # The hatchling-dev unit tests exercise the real
      # `cargo mutants --version` shell-out in one test
      # (toolchain_id_contains_mutants_version); every other test uses
      # a sentinel so the suite stays hermetic. Install the prebuilt
      # binary (pinned to the version the project standardizes on) so
      # that one test runs the real tool on CI too. Prebuilt: the MSRV
      # job could not compile it from source.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      # Ubuntu runners restrict unprivileged user namespaces through
      # AppArmor: unshare succeeds but grants no capabilities, so every cell
      # test would skip. Lift the restriction for this job.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A seccomp kill is SIGSYS, which dumps core, and Ubuntu pipes every core
      # dump to apport. The denied-syscall catalogs kill hundreds of probes in
      # minutes; the apport processes that spawned exhausted the runner's memory
      # (OOM, swap, 30 s stalls). Write core files instead, to an absolute path
      # (the kernel requires one with fs.suid_dumpable=2): the core size limit
      # is 0, and a cell's root is read-only, so nothing is written.
      - name: Don't hand core dumps to apport
        run: |
          echo "core size limit: $(ulimit -c)"
          sudo sysctl -w kernel.core_pattern=/var/tmp/core

      # A sample every 5 s while the gate runs, to show what the runner is
      # doing if a probe cell or `ldd` stalls (blocked tasks, I/O wait, steal).
      - name: Start a runner sampler
        run: nohup vmstat -t -w 5 > "$RUNNER_TEMP/vmstat.log" 2>&1 &

      - name: Delegate cgroups for real resource-limit tests
        run: |
          cg=/sys/fs/cgroup/hatchling-ci
          sudo mkdir "$cg"
          echo '+pids +memory +cpu' | sudo tee "$cg/cgroup.subtree_control" > /dev/null
          sudo mkdir "$cg/runner" "$cg/cells"
          sudo chown "$(id -u):$(id -g)" "$cg" "$cg/cgroup.procs" "$cg/cgroup.subtree_control"
          sudo chown -R "$(id -u):$(id -g)" "$cg/runner" "$cg/cells"

      # The browser cell's tests run a real headless Chromium: the one
      # they were measured with, Chrome for Testing 143.0.7499.4, fetched
      # from its own release and checked against its SHA-256
      # (scripts/fetch-test-browser.sh), with its libraries.
      - name: Install the pinned headless Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r frontend/tests/e2e/requirements.txt
          # The browser's system libraries, from apt.
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install-deps chromium-headless-shell
          shell=$(bash scripts/fetch-test-browser.sh "$RUNNER_TEMP/browser")
          echo "HATCHLING_TEST_BROWSER=$shell" >> "$GITHUB_ENV"

      - name: Run gate
        run: |
          # This shell and its descendants must share the delegated ancestor
          # with the test cells. Moving a setup step's shell would not carry
          # over to this step or any subsequent step.
          echo $$ | sudo tee /sys/fs/cgroup/hatchling-ci/runner/cgroup.procs > /dev/null
          bash scripts/check.sh

      # A cell killed by seccomp hands no core to a host crash handler
      # (WO-011). The check needs a real kernel's pipe core_pattern, which it
      # sets for the while as root and puts back: a plain process's SIGSYS
      # must reach its handler, and a cell's must not.
      - name: No core reaches a crash handler
        run: |
          bin=$(cargo test -q --locked --all-features -p hatchling-broker --test adversarial --no-run --message-format=json \
            | grep -o '"executable":"[^"]*adversarial[^"]*"' | tail -1 | cut -d'"' -f4)
          # A root broker's cell runs as an unprivileged user, which can't
          # read the runner's home: the binaries go where it can.
          copy=$(mktemp -d /tmp/hatchling-core.XXXXXX)
          mkdir "$copy/deps"
          cp "$bin" "$copy/deps/adversarial"
          cp target/debug/hatchling-probe "$copy/"
          chmod -R a+rX "$copy"
          # Its cell runs as the README's cell user, the id map's base
          # (WO-015).
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin hatchling-cell
          cd crates/hatchling-broker
          sudo env HATCHLING_REQUIRE_CELL=1 HATCHLING_CORE_PATTERN_TEST=1 \
            HATCHLING_CELL_UID_BASE="$(id -u hatchling-cell)" "$copy/deps/adversarial" \
            a_seccomp_kill_hands_no_core_to_the_hosts_crash_handler --exact
          echo "core_pattern after: $(cat /proc/sys/kernel/core_pattern)"

      # The broker starts its spawner helpers (skill cells, scheduled runs,
      # subagents, harnesses) by re-running its own executable. Run the suites
      # that use them again with `hatchling` (crate hatchling-runtime) as that
      # executable, so the front door's routing is proven with real cells.
      - name: Spawner helpers through hatchling
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/hatchling-ci/runner/cgroup.procs > /dev/null
          HATCHLING_TEST_SPAWNER="$PWD/target/debug/hatchling" \
            cargo test -p hatchling-broker --locked \
            --test skill_run --test schedule_run --test subagents \
            --test harness --test harness_cli --test skill_cell_spawn

      # The denied-syscall catalogs kill hundreds of probes in minutes, and
      # each seccomp kill is audited. Report how many audit records this job
      # produced and whether the kernel's audit backlog overflowed, which
      # stalls any process that audits.
      - name: Kernel audit report
        if: always()
        run: |
          echo "seccomp audit records: $(sudo dmesg | grep -c 'type=1326' || true)"
          echo "backlog or rate-limit lines: $(sudo dmesg | grep -cE 'backlog limit exceeded|audit: rate limit|audit_lost' || true)"
          sudo dmesg | grep -E 'backlog limit exceeded|audit: rate limit|audit_lost' | tail -5 || true
          echo "seccomp actions logged: $(cat /proc/sys/kernel/seccomp/actions_logged)"
          systemctl is-active auditd systemd-journald 2>/dev/null || true
          echo 'vmstat samples with blocked tasks, I/O wait over 10% or steal over 10%:'
          awk 'NR <= 2 || $2 > 0 || $16 > 10 || $17 > 10' "$RUNNER_TEMP/vmstat.log" | head -60 || true
          echo 'kernel log tail:'
          sudo dmesg -T | tail -40 || true

  # WO-015: the cell suites as root, as the README's quickstart runs the
  # broker. Built as the runner, run as root from a copy the cells' user can
  # read (scripts/root-pass.sh), with the README's users, every suite
  # required to run.
  root:
    name: cells as root
    runs-on: ubuntu-26.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Allow real cells
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # As the gate: a seccomp kill dumps core, and apport must not get it.
      - name: Don't hand core dumps to apport
        run: sudo sysctl -w kernel.core_pattern=/var/tmp/core

      # The browser cells' suites run the gate's pinned headless Chromium.
      # Run as root, the broker reads it as its own user and the cells as
      # theirs: it goes where both can, not under the runner's home.
      - name: Install the pinned headless Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r frontend/tests/e2e/requirements.txt
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install-deps chromium-headless-shell
          shell=$(bash scripts/fetch-test-browser.sh "$RUNNER_TEMP/browser")
          sudo cp -r "$(dirname "$shell")" /opt/
          sudo chmod -R a+rX /opt/chrome-headless-shell-linux64
          echo "HATCHLING_TEST_BROWSER=/opt/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"

      - name: The README's users
        run: |
          for u in hatchling-cell hatchling-broker hatchling-keeper hatchling-egress; do
            sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin "$u"
          done

      # The room disk's suite makes real LUKS2 images (0.9).
      - name: cryptsetup and dm_crypt, for the room disk
        run: |
          timeout 300 sudo apt-get update -qq
          timeout 300 sudo apt-get install -y -qq cryptsetup-bin
          timeout 30 sudo modprobe dm_crypt

      - name: Run the cell suites as root
        run: HATCHLING_ROOT_PASS=1 bash scripts/check.sh

  # 0.9's room disk, ahead of the code that makes one: can a runner, as
  # root, make a LUKS2 image from a key in a pipe, open it, mount it
  # nodev,nosuid,noexec, change its key slot, and close it again
  # (scripts/room-disk-probe.sh)? Every step must pass, and none is skipped.
  room-disk:
    name: room disk probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # As a setup will add it: cryptsetup alone, not its boot-time hooks.
      - name: Install cryptsetup-bin
        run: |
          timeout 300 sudo apt-get update -qq
          timeout 300 sudo apt-get install -y -qq cryptsetup-bin

      - name: Make, open, mount, rekey and close a room disk, as root
        run: timeout 600 sudo bash scripts/room-disk-probe.sh

  service:
    # WO-033: Hatchling installed on a fresh runner with systemd, from this
    # commit's own build, as a stock Ubuntu has it (Ubuntu's AppArmor
    # restriction on user namespaces left on): the broker and the app's
    # host start as services, the agent answers through the API, and again
    # after the broker restarts. It installs as a person does, with
    # get-hatchling.sh from files laid out as a release has them, so the
    # one-command install, and the scripts/install.sh it runs, are proven
    # on every change.
    name: install as a service
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: get-hatchling.sh refuses what it should (tampered files, a bad installer, root, no model)
        run: python3 -m unittest discover -s scripts -p 'test_get.py' -v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the programs and the app
        run: |
          cargo build --release --locked -p hatchling-broker -p hatchling-agent -p hatchling-host -p hatchling-browser
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          mkdir -p "$RUNNER_TEMP/files"
          cp target/release/hatchling-broker target/release/hatchling-agent target/release/hatchling-host target/release/hatchling-browser "$RUNNER_TEMP/files/"
          cp -R frontend/dist "$RUNNER_TEMP/files/ui"

      - name: Lay the build out as a release
        run: |
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          for program in hatchling-broker hatchling-agent hatchling-host hatchling-browser; do
            cp "target/release/$program" "$release/$program-x86_64-unknown-linux-gnu"
          done
          (cd "$RUNNER_TEMP/files" && tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - ui | gzip -n -9 > "$release/hatchling-ui.tar.gz")
          scripts/release-installer.sh "$release" v0.0.0-ci
          (cd "$release" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          mkdir "$RUNNER_TEMP/release-installer"
          tar -xzf "$release/hatchling-installer.tar.gz" -C "$RUNNER_TEMP/release-installer"

      - name: Install, and ask the agent, before and after a restart
        run: |
          set -o pipefail
          python3 docs/examples/stand-in-model.py 18089 > "$RUNNER_TEMP/model.log" 2>&1 &
          # Run from elsewhere, as a person who downloaded it would.
          cp "$RUNNER_TEMP/release/get-hatchling.sh" "$HOME/get-hatchling.sh"
          grep -q "^VERSION=v0.0.0-ci$" "$HOME/get-hatchling.sh"
          # Type=exec reports the fixture shell active while the broker and its tokens are still held.
          dropin=/run/systemd/system/hatchling.service.d/ci-delay.conf
          release_broker=/run/hatchling-ci-release-broker
          cleanup_delay() {
            sudo touch "$release_broker"
            sudo rm -f -- "$dropin"
            sudo systemctl daemon-reload
          }
          trap cleanup_delay EXIT
          sudo install -d "${dropin%/*}"
          sudo tee "$dropin" >/dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/bin/sh -ec 'until test -e /run/hatchling-ci-release-broker; do sleep 0.1; done; exec /usr/local/bin/hatchling-broker'
          EOF
          : > "$RUNNER_TEMP/install.log"
          (cd "$HOME" && sh get-hatchling.sh --from-url "file://$RUNNER_TEMP/release" --model-endpoint http://localhost:18089/v1 --model stand-in) | tee "$RUNNER_TEMP/install.log" &
          install_pid=$!
          for _ in $(seq 120); do
            grep -Fq "waiting for the broker's app tokens" "$RUNNER_TEMP/install.log" && break
            kill -0 "$install_pid" 2>/dev/null || { wait "$install_pid"; exit 1; }
            sleep 1
          done
          grep -Fq "waiting for the broker's app tokens" "$RUNNER_TEMP/install.log"
          systemctl is-active --quiet hatchling.service
          [ ! -e /var/lib/hatchling/ui.sock.token ]
          [ ! -e /var/lib/hatchling/operator.sock.token ]
          if systemctl is-active --quiet "hatchling-host@$USER.service"; then
            echo "the app host started before the broker could write its tokens" >&2
            exit 1
          fi
          sudo touch "$release_broker"
          wait "$install_pid"
          cleanup_delay
          trap - EXIT
          sudo rm -f -- "$release_broker"
          grep -q "checking every file against the release's SHA256SUMS" "$RUNNER_TEMP/install.log"
          grep -q "http://127.0.0.1:7340/#hatchling-ui=" "$RUNNER_TEMP/install.log"
          timeout 180 python3 docs/examples/first-run.py /var/lib/hatchling/api.sock
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:7340/ > /dev/null
          token=$(cat /var/lib/hatchling/ui.sock.token)
          sudo systemctl restart hatchling.service
          for _ in $(seq 60); do
            [ -s /var/lib/hatchling/ui.sock.token ] && [ "$(cat /var/lib/hatchling/ui.sock.token)" != "$token" ] && break
            sleep 1
          done
          [ "$(cat /var/lib/hatchling/ui.sock.token)" != "$token" ]
          [ "$(hatchling-host url)" = "http://127.0.0.1:7340/#hatchling-ui=$(cat /var/lib/hatchling/ui.sock.token)" ]
          # The app's host runs as the owner, as a system service, confined.
          systemctl is-active --quiet "hatchling-host@$USER.service"
          [ "$(systemctl show "hatchling-host@$USER.service" -p User --value)" = "$USER" ]
          [ "$(ps -o user= -C hatchling-host | sort -u)" = "$USER" ]
          [ "$(systemctl show "hatchling-host@$USER.service" -p NoNewPrivileges --value)" = yes ]
          timeout 180 python3 docs/examples/first-run.py /var/lib/hatchling/api.sock
          curl -fsS http://127.0.0.1:7340/ > /dev/null

      # 0.9's room disk: made and opened at the start, closed whenever the
      # service stops (ExecStopPost), and opened again at the next start.
      - name: The room disk opens with the service, and closes when it stops
        run: |
          timeout 300 sudo apt-get install -y -qq dmsetup
          [ -x /usr/sbin/cryptsetup ] || { echo "install.sh didn't add cryptsetup-bin"; exit 1; }
          mapped() { sudo dmsetup ls --target crypt | grep -q '^hatchling-room-'; }
          waited() {
            for _ in $(seq 90); do mapped && return 0; sleep 2; done
            sudo journalctl -u hatchling --no-pager | grep -i "room disk" | tail -20
            return 1
          }
          waited || { echo "the room disk isn't open while the service runs"; exit 1; }
          sudo systemctl stop hatchling.service
          if mapped; then echo "stopping the service left the room disk open"; exit 1; fi
          sudo systemctl start hatchling.service
          waited || { echo "the room disk didn't open again at the next start"; exit 1; }
          sudo hatchling-broker doctor | grep "room disk"

      - name: Check the connected room-disk proof's guards
        run: python3 -m unittest discover -s scripts -p 'test_room_disk_app.py' -v

      - name: Install a browser for the installed app
        run: |
          python3 -m venv "$RUNNER_TEMP/room-app-venv"
          "$RUNNER_TEMP/room-app-venv/bin/python" -m pip install -r frontend/tests/e2e/requirements.txt
          timeout -k 10 600 "$RUNNER_TEMP/room-app-venv/bin/python" -m playwright install-deps chromium
          timeout -k 10 300 "$RUNNER_TEMP/room-app-venv/bin/python" -m playwright install chromium

      - name: The real room disk is shown in the connected app
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/room-disk-app"
          sudo python3 scripts/room_disk_app.py snapshot > "$RUNNER_TEMP/room-disk-app/disk.json"
          "$RUNNER_TEMP/room-app-venv/bin/python" scripts/room_disk_app.py check "$RUNNER_TEMP/room-disk-app/disk.json" "$RUNNER_TEMP/room-disk-app"

      - name: Retain the room-disk app proof and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-disk-in-the-app
          path: ${{ runner.temp }}/room-disk-app

      - name: Doctor finds nothing wrong, then names a stopped model
        run: |
          sudo hatchling-broker doctor | tee "$RUNNER_TEMP/doctor.log"
          grep -q "^Nothing found wrong.$" "$RUNNER_TEMP/doctor.log"
          pkill -f "stand-in-model.py 18089"
          if sudo hatchling-broker doctor > "$RUNNER_TEMP/doctor.log"; then exit 1; fi
          cat "$RUNNER_TEMP/doctor.log"
          grep -q "^  PROBLEM  model          nothing answers at localhost:18089" "$RUNNER_TEMP/doctor.log"
          grep -q "^1 problem to fix.$" "$RUNNER_TEMP/doctor.log"

      - name: Operator commands take the service's settings, from a file only root can change
        run: |
          sudo hatchling-broker tools list 2> "$RUNNER_TEMP/settings.err"
          grep -q "with the service's settings, from /etc/hatchling/hatchling.env" "$RUNNER_TEMP/settings.err"
          sudo chmod 666 /etc/hatchling/hatchling.env
          if sudo hatchling-broker tools list 2> "$RUNNER_TEMP/settings.err"; then exit 1; fi
          cat "$RUNNER_TEMP/settings.err"
          grep -q "it isn't read" "$RUNNER_TEMP/settings.err"
          if sudo hatchling-broker doctor > "$RUNNER_TEMP/doctor.log"; then exit 1; fi
          cat "$RUNNER_TEMP/doctor.log"
          grep -q "^  PROBLEM  settings       /etc/hatchling/hatchling.env can be changed by someone else" "$RUNNER_TEMP/doctor.log"
          sudo chmod 600 /etc/hatchling/hatchling.env
          sudo hatchling-broker tools list > /dev/null

      - name: A hosted model, with no model on this machine, its key piped to use-hosted's prompt
        run: |
          # A configuration written again (--force), for a hosted model: no
          # local server, nothing in egress but the provider. With no key
          # given, it stops before starting anything.
          if sudo sh "$RUNNER_TEMP/release-installer/scripts/install.sh" --from "$RUNNER_TEMP/release" --hosted openrouter --force < /dev/null > "$RUNNER_TEMP/install-hosted-nokey.log" 2>&1; then exit 1; fi
          cat "$RUNNER_TEMP/install-hosted-nokey.log"
          grep -q "the hosted model wasn't set up, and nothing was started: run this again" "$RUNNER_TEMP/install-hosted-nokey.log"
          # Run again, as it says, with the key (a stand-in; nothing calls the
          # provider here): it keeps that configuration, and finishes it.
          echo 'sk-or-v1-stand-in-key-for-ci' | sudo sh "$RUNNER_TEMP/release-installer/scripts/install.sh" --from "$RUNNER_TEMP/release" --hosted openrouter | tee "$RUNNER_TEMP/install-hosted.log"
          grep -q "setting up openrouter" "$RUNNER_TEMP/install-hosted.log"
          grep -q "^Nothing found wrong.$" "$RUNNER_TEMP/install-hosted.log"
          grep -q "http://127.0.0.1:7340/#hatchling-ui=" "$RUNNER_TEMP/install-hosted.log"
          sudo grep -qx 'HATCHLING_SCHEDULER_MODEL_ENDPOINT=https://openrouter.ai/api/v1' /etc/hatchling/hatchling.env
          sudo grep -qx 'HATCHLING_EGRESS_ALLOWLIST=openrouter.ai:443' /etc/hatchling/hatchling.env
          sudo grep -qx 'HATCHLING_EGRESS_GRANTS=openrouter.ai:443' /etc/hatchling/hatchling.env
          sudo grep -q '^HATCHLING_API_GRANTS=channel-send:local,.*,egress:openrouter.ai:443$' /etc/hatchling/hatchling.env
          if sudo grep -v '^#' /etc/hatchling/hatchling.env | grep -q 'localhost\|MODEL_OTHER'; then exit 1; fi
          # The key is in the vault: asked again, it isn't asked for.
          sudo hatchling-broker secret add --for openrouter.ai:443 --if-missing < /dev/null 2>&1 | tee "$RUNNER_TEMP/secrets.log"
          grep -q "egress-openrouter-ai-443 is in the vault already" "$RUNNER_TEMP/secrets.log"
          if sudo grep -rq "stand-in-key-for-ci" /etc/hatchling /var/lib/hatchling; then exit 1; fi
          # A provider it doesn't know is refused.
          if sudo sh "$RUNNER_TEMP/release-installer/scripts/install.sh" --from "$RUNNER_TEMP/release" --hosted elsewhere < /dev/null; then exit 1; fi

      - name: The services' logs
        if: always()
        run: |
          sudo journalctl -u hatchling.service --no-pager | tail -80
          sudo journalctl -u 'hatchling-host@*' --no-pager | tail -40 || true

  upgrade:
    # Upgrade safety: the last release installed as a person installs it,
    # given state through the API (schedules, a conversation), then this
    # commit installed over it by scripts/install.sh. Every schedule must
    # survive with its timing and grants, still due, and the agent must
    # still answer. An update that eats someone's schedules fails here.
    name: upgrade from the last release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the programs and the app
        run: |
          cargo build --release --locked -p hatchling-broker -p hatchling-agent -p hatchling-host -p hatchling-browser
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          mkdir -p "$RUNNER_TEMP/files"
          cp target/release/hatchling-broker target/release/hatchling-agent target/release/hatchling-host target/release/hatchling-browser "$RUNNER_TEMP/files/"
          cp -R frontend/dist "$RUNNER_TEMP/files/ui"

      - name: The last release, and its own installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "upgrading from $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
          git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          git worktree add "$RUNNER_TEMP/previous" "$tag"

      - name: Install the last release, and give it state
        run: |
          python3 docs/examples/stand-in-model.py 18089 > "$RUNNER_TEMP/model.log" 2>&1 &
          (cd "$RUNNER_TEMP/previous" && sudo scripts/install.sh --from "$RUNNER_TEMP/release" --model-endpoint http://localhost:18089/v1 --model stand-in) > "$RUNNER_TEMP/install-previous.log"
          timeout 180 python3 docs/examples/first-run.py /var/lib/hatchling/api.sock
          SEED_GRANTS=egress:localhost:18089,channel-send:local python3 scripts/upgrade_state.py seed /var/lib/hatchling/api.sock "$RUNNER_TEMP/state.json"

      - name: Upgrade to this commit, and check nothing was lost
        run: |
          sudo scripts/install.sh --from "$RUNNER_TEMP/files" --model-endpoint http://localhost:18089/v1 --model stand-in > "$RUNNER_TEMP/install-upgrade.log"
          python3 scripts/upgrade_state.py verify /var/lib/hatchling/api.sock "$RUNNER_TEMP/state.json"
          timeout 180 python3 docs/examples/first-run.py /var/lib/hatchling/api.sock
          sudo hatchling-broker doctor
          # The app's host moved from the owner's user service to a system
          # one: the old one is gone, and the new one serves the app.
          if [ -f /etc/systemd/user/hatchling-host.service ]; then
            grep -q "its old user service is removed" "$RUNNER_TEMP/install-upgrade.log"
          fi
          [ ! -e /etc/systemd/user/hatchling-host.service ]
          if systemctl --user is-active --quiet hatchling-host.service; then exit 1; fi
          systemctl is-active --quiet "hatchling-host@$USER.service"
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:7340/ > /dev/null

      - name: Upgrade a configuration from before the kept stores
        run: |
          # The last release may already keep the conversation, goals and
          # memory, so the upgrade above can have nothing to add. Take them
          # out of the kept configuration, as one from 0.5.0 had none of
          # them, and install again: the installer must add each back with
          # its grants, back up the old file, and lose no state.
          sudo sed -i -E \
            -e '/^HATCHLING_(CONVERSATION_DIR|GOALS_DIR|GOALS_GRANTS|MEMORY_DIR|MEMORY_GRANTS)=/d' \
            -e '/^HATCHLING_API_GRANTS=/s/,(goals|memory):[^,]*//g' \
            /etc/hatchling/hatchling.env
          if sudo grep -qE '^HATCHLING_(GOALS|MEMORY)_|(goals|memory):' /etc/hatchling/hatchling.env; then
            echo "the kept stores weren't all taken out"; exit 1
          fi
          sudo scripts/install.sh --from "$RUNNER_TEMP/files" --keep-model > "$RUNNER_TEMP/install-keep-up.log"
          grep -q 'added what this version keeps for you' "$RUNNER_TEMP/install-keep-up.log"
          python3 scripts/upgrade_state.py verify /var/lib/hatchling/api.sock "$RUNNER_TEMP/state.json"
          timeout 180 python3 docs/examples/first-run.py /var/lib/hatchling/api.sock
          sudo hatchling-broker doctor
          sudo grep -q '^HATCHLING_CONVERSATION_DIR=/' /etc/hatchling/hatchling.env
          sudo grep -q '^HATCHLING_GOALS_DIR=/' /etc/hatchling/hatchling.env
          sudo grep -q '^HATCHLING_GOALS_GRANTS=query-goals' /etc/hatchling/hatchling.env
          sudo grep -q '^HATCHLING_API_GRANTS=.*,goals:query-goals' /etc/hatchling/hatchling.env
          sudo grep -q '^HATCHLING_MEMORY_GRANTS=user:recall,project:recall,user:propose' /etc/hatchling/hatchling.env
          sudo grep -q '^HATCHLING_API_GRANTS=.*,memory:user:propose' /etc/hatchling/hatchling.env
          sudo sh -c 'ls /etc/hatchling/hatchling.env.before-*'

      - name: The installs' and services' logs
        if: always()
        run: |
          sed -E 's/(hatchling-(ui|operator)=)[0-9a-zA-Z]+/\1<token>/g' "$RUNNER_TEMP"/install-*.log || true
          sudo journalctl -u hatchling.service --no-pager | tail -80

  quickstart:
    name: README quickstart
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check quickstart runner
        run: python3 -m unittest discover -s scripts -p 'test_readme_quickstart.py' -v

      - name: Install a browser for the app
        run: |
          python3 -m venv "$RUNNER_TEMP/app-venv"
          "$RUNNER_TEMP/app-venv/bin/python" -m pip install -r frontend/tests/e2e/requirements.txt
          # The system libraries, from apt, once. Then the browsers: their download
          # has hung for 20 minutes at a time, so each try is bounded, killed
          # outright if it lingers, and a stuck one is tried again.
          "$RUNNER_TEMP/app-venv/bin/python" -m playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout -k 10 300 "$RUNNER_TEMP/app-venv/bin/python" -m playwright install chromium && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done

      - name: Allow real cells
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the README commands as root
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          task_work=$(mktemp -d "$RUNNER_TEMP/hatchling-quickstart.XXXXXX")
          trap 'sudo rm -rf -- "$task_work"' EXIT
          sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            unshare --mount --pid --fork --kill-child --mount-proc \
            python3 scripts/readme_quickstart.py "$PWD" \
              "$RUNNER_TEMP/quickstart-logs" "$task_work" \
              --app-python "$RUNNER_TEMP/app-venv/bin/python"

      - name: Retain the extracted commands and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-quickstart
          path: ${{ runner.temp }}/quickstart-logs

  # WO-014: no root. Cells run on the runner user's subordinate ids, with
  # Ubuntu's user-namespace restriction left on: only binaries an AppArmor
  # profile allows may create user namespaces, as on a stock desktop.
  # WO-029: the owner drives the agent's browser from the app. A root
  # broker with the pinned Chromium as its browser, the scripted browsing
  # model, the app's host, and Playwright using the app as the owner would:
  # allow the site, open the browser, take control, scroll, hand it back.
  # Then (WO-031) the agent signs in with a canary sign-in the owner kept,
  # and the broker's memory and log are scanned for it.
  browser:
    name: browser in the app
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          # As rust-toolchain.toml lists them: installed now, not by the
          # first cargo, which conflicts with the runner's own rustfmt.
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the pinned headless Chromium, and a browser for the app
        run: |
          python3 -m venv "$RUNNER_TEMP/app-venv"
          "$RUNNER_TEMP/app-venv/bin/python" -m pip install -r frontend/tests/e2e/requirements.txt
          # The system libraries, from apt, once. Then the browsers: their download
          # has hung for 20 minutes at a time, so each try is bounded, killed
          # outright if it lingers, and a stuck one is tried again.
          "$RUNNER_TEMP/app-venv/bin/python" -m playwright install-deps chromium chromium-headless-shell
          for attempt in 1 2 3; do
            timeout -k 10 300 "$RUNNER_TEMP/app-venv/bin/python" -m playwright install chromium && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          # The cell's browser: the one its tests were measured with.
          shell=$(bash scripts/fetch-test-browser.sh "$RUNNER_TEMP/browser")
          # Run as root, the broker reads the bundle as its own user, which
          # can't search a home: the bundle goes where the README puts it.
          sudo cp -r "$(dirname "$shell")" /opt/
          shell=/opt/$(basename "$(dirname "$shell")")/$(basename "$shell")
          sudo chmod -R a+rX "$(dirname "$shell")"
          echo "20ffc88be1c6f7dc8351bebfaca965ff9a07617bddf696f0b67ef85e5868b29a  $shell" | sha256sum --check
          echo "CELL_BROWSER=$shell" >> "$GITHUB_ENV"

      - name: Build and install
        run: |
          cargo build --release --locked -p hatchling-broker -p hatchling-agent -p hatchling-host -p hatchling-browser
          sudo install -m 755 target/release/hatchling-broker target/release/hatchling-agent target/release/hatchling-host target/release/hatchling-browser /usr/local/bin/
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin hatchling-cell
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin hatchling-keeper
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin hatchling-egress
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin hatchling-broker
          (cd frontend && npm ci && npm run build)

      - name: Allow real cells
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check the browser proofs' helpers
        run: |
          python3 -m unittest discover -s scripts -p 'test_browser_end_to_end.py' -v
          python3 -m unittest discover -s scripts -p 'test_idea_model.py' -v
          python3 -m unittest discover -s scripts -p 'test_turns_model.py' -v

      - name: Drive the agent's browser from the app
        run: |
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright"             unshare --mount --pid --fork --kill-child --mount-proc             scripts/browser_end_to_end.sh "$CELL_BROWSER" "$RUNNER_TEMP/app-venv/bin/python" "$RUNNER_TEMP/browser-e2e"

      - name: Approve a build from the app
        run: |
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright"             unshare --mount --pid --fork --kill-child --mount-proc             scripts/approval_end_to_end.sh "$RUNNER_TEMP/app-venv/bin/python" "$RUNNER_TEMP/approval-e2e"

      - name: Propose a build from the chat
        run: |
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright"             unshare --mount --pid --fork --kill-child --mount-proc             scripts/chat_build_end_to_end.sh "$RUNNER_TEMP/app-venv/bin/python" "$RUNNER_TEMP/chat-build-e2e"

      - name: Keep the conversation across restarts, and start a new one, from the app
        run: |
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright"             unshare --mount --pid --fork --kill-child --mount-proc             scripts/conversation_end_to_end.sh "$RUNNER_TEMP/app-venv/bin/python" "$RUNNER_TEMP/conversation-e2e"

      - name: Retain the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-in-the-app
          path: |
            ${{ runner.temp }}/browser-e2e
            ${{ runner.temp }}/approval-e2e
            ${{ runner.temp }}/chat-build-e2e
            ${{ runner.temp }}/conversation-e2e

  rootless:
    name: without root
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The user-namespace restriction is on
        run: test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1

      # Distinct uid and gid ranges: a range used for both hides a uid read
      # where a gid belongs.
      - name: Give the runner distinct subordinate ranges
        run: |
          me=$(id -un)
          sudo sed -i "/^$me:/d" /etc/subuid /etc/subgid
          echo "$me:200000:65536" | sudo tee -a /etc/subuid > /dev/null
          echo "$me:300000:65536" | sudo tee -a /etc/subgid > /dev/null
          cat /etc/subuid /etc/subgid
          ls -l "$(command -v newuidmap)" "$(command -v newgidmap)"

      - name: Build the tests
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          cargo build --locked --workspace --bins
          cargo test --locked -p hatchling-sys -p hatchling-isolation -p hatchling-broker --no-run

      # Doctor, as a new user would meet it: the restriction stops cells,
      # and it says so, and what to do.
      - name: Doctor names AppArmor
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/doctor/sock" "$RUNNER_TEMP/doctor/vault"
          cat > "$RUNNER_TEMP/doctor.env" <<EOF
          HATCHLING_BROKER_SOCKET=$RUNNER_TEMP/doctor/sock/broker.sock
          HATCHLING_AGENT_UID=$(id -u)
          HATCHLING_AGENT_BIN=$GITHUB_WORKSPACE/target/debug/hatchling-agent
          HATCHLING_CELL_ID=cell-01
          HATCHLING_VAULT_DIR=$RUNNER_TEMP/doctor/vault
          HATCHLING_SCHEDULER_MODEL_ENDPOINT=http://localhost:18089/v1
          HATCHLING_SCHEDULER_MODEL_NAME=stand-in
          EOF
          python3 docs/examples/stand-in-model.py 18089 2> /dev/null &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:18089/v1/models > /dev/null
          doctor() { target/debug/hatchling-broker doctor --env "$RUNNER_TEMP/doctor.env"; }
          if doctor > "$RUNNER_TEMP/doctor.log"; then exit 1; fi
          cat "$RUNNER_TEMP/doctor.log"
          grep -q "^  ok       settings " "$RUNNER_TEMP/doctor.log"
          grep -q "^  ok       agent program " "$RUNNER_TEMP/doctor.log"
          grep -q "^  PROBLEM  cells          AppArmor " "$RUNNER_TEMP/doctor.log"
          grep -q "^  ok       model          stand-in at " "$RUNNER_TEMP/doctor.log"
          echo "DOCTOR_PID=$!" >> "$GITHUB_ENV"

      # The tests create user namespaces from the build tree's binaries.
      - name: Allow the build tree user namespaces
        run: |
          sudo tee /etc/apparmor.d/hatchling-ci-tests > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile hatchling-ci-tests $GITHUB_WORKSPACE/target/debug/** flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/hatchling-ci-tests

      - name: Doctor finds nothing wrong once the profile allows it
        run: |
          target/debug/hatchling-broker doctor --env "$RUNNER_TEMP/doctor.env" | tee "$RUNNER_TEMP/doctor.log"
          grep -q "^Nothing found wrong.$" "$RUNNER_TEMP/doctor.log"
          kill "$DOCTOR_PID"

      - name: Cells on subordinate ids
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
          HATCHLING_REQUIRE_CELL: "1"
          HATCHLING_REQUIRE_SUBID: "1"
        run: |
          cargo test --locked -p hatchling-sys --lib -- subid:: tree::
          cargo test --locked -p hatchling-isolation --lib -- subordinate
          cargo test --locked -p hatchling-broker --lib -- subordinate harness_tree::
          cargo test --locked -p hatchling-broker --test cell_boundary --test harness -- subordinate

      - name: Install a browser for the app
        run: |
          python3 -m venv "$RUNNER_TEMP/app-venv"
          "$RUNNER_TEMP/app-venv/bin/python" -m pip install -r frontend/tests/e2e/requirements.txt
          # The system libraries, from apt, once. Then the browsers: their download
          # has hung for 20 minutes at a time, so each try is bounded, killed
          # outright if it lingers, and a stuck one is tried again.
          "$RUNNER_TEMP/app-venv/bin/python" -m playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout -k 10 300 "$RUNNER_TEMP/app-venv/bin/python" -m playwright install chromium && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done

      # The README's own setup adds the runner's range, as for a new user.
      - name: Take the runner's ranges away again
        run: |
          me=$(id -un)
          sudo sed -i "/^$me:/d" /etc/subuid /etc/subgid
          sudo apparmor_parser -R /etc/apparmor.d/hatchling-ci-tests
          sudo rm /etc/apparmor.d/hatchling-ci-tests

      # The README's shell must be unconfined, so the broker's profile
      # attaches when it runs.
      - name: AppArmor label of the README's shell
        run: |
          sudo unshare --mount --pid --fork --kill-child --mount-proc \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups cat /proc/self/attr/current
          echo
          sudo aa-status | grep -iE 'unshare|setpriv|sudo|userns' || true

      # Root makes the PID namespace (it ends every process the README
      # starts), then drops to the runner user for the README's commands.
      # sudo leaves a hard core limit of 0, which a login session doesn't,
      # and a cell can't raise it without root where core dumps go to a
      # crash handler (apport here): prlimit puts the session's back.
      - name: Run the README commands without root
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          task_work=$(mktemp -d "$RUNNER_TEMP/hatchling-rootless.XXXXXX")
          trap 'sudo rm -rf -- "$task_work"' EXIT
          sudo env "PATH=$PATH" "HOME=$HOME" "USER=$USER" "LOGNAME=$USER" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            unshare --mount --pid --fork --kill-child --mount-proc \
            prlimit --core=0:unlimited \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            python3 scripts/readme_quickstart.py "$PWD" \
              "$RUNNER_TEMP/rootless-logs" "$task_work" \
              --app-python "$RUNNER_TEMP/app-venv/bin/python" --rootless

      - name: Retain the extracted commands and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-quickstart-rootless
          path: ${{ runner.temp }}/rootless-logs

  hosted-model:
    name: hosted model (${{ matrix.mode }})
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [local, https]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check hosted-model proof helpers
        run: |
          python3 -m unittest discover -s scripts -p 'test_first_run.py' -v
          python3 -m unittest discover -s scripts -p 'test_*hosted_model*.py' -v

      - name: Build the broker and agent
        run: cargo build --locked -p hatchling-broker -p hatchling-agent

      - name: Fetch pinned test-only model fixtures
        if: matrix.mode == 'local'
        run: python3 scripts/fetch_hosted_model.py "$RUNNER_TEMP/hosted-fixtures"

      - name: Allow real cells
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prove sealed model access through a real cell
        env:
          PROOF_MODE: ${{ matrix.mode }}
        run: |
          task_work=$(mktemp -d "$RUNNER_TEMP/hatchling-hosted.XXXXXX")
          trap 'sudo rm -rf -- "$task_work"' EXIT
          fixture_args=()
          if [[ "$PROOF_MODE" == local ]]; then
            fixture_args=(--fixtures "$RUNNER_TEMP/hosted-fixtures/paths.json")
          fi
          sudo unshare --mount --pid --fork --kill-child --mount-proc --net \
            python3 scripts/hosted_model_smoke.py "$PWD" \
              "$RUNNER_TEMP/hosted-model-logs" "$task_work" \
              --mode "$PROOF_MODE" "${fixture_args[@]}"

      - name: Retain nonsecret proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-model-${{ matrix.mode }}
          path: ${{ runner.temp }}/hosted-model-logs

  publish:
    # Every crate the hatchling-runtime front door needs is published to
    # crates.io. Each must stay publishable: metadata, versioned dependencies,
    # and a build of each packaged crate on its own, in dependency order.
    name: crates.io dry run
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Package and verify every published crate
        run: cargo publish --workspace --dry-run --locked

  semver:
    # The published crates' public APIs against their latest release on
    # crates.io. A breaking change needs a version bump: before 1.0, the
    # minor version (the first breaking pull request after a release bumps
    # the workspace version).
    name: semver checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Public APIs against crates.io
        run: |
          # A crate new to crates.io has no baseline yet; it's checked
          # from its first release on (the test is publish-crates.sh's).
          new=()
          for crate in $(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.publish != []) | .name'); do
            if ! cargo info "$crate" --registry crates-io < /dev/null > /dev/null 2>&1; then
              echo "::notice::$crate is new to crates.io: no baseline to check it against"
              new+=(--exclude "$crate")
            fi
          done
          cargo semver-checks --workspace "${new[@]}"

  protocol:
 # the frontend/backend contract has one source, hatchling-core's
    # wire types. Both generated sides must match it: the schema (Rust) and
    # the TypeScript types (frontend). A stale or hand-edited side fails here.
    name: protocol drift
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Schema matches the Rust wire types
        run: cargo run -p hatchling-dev --locked -- protocol-schema

      - name: TypeScript matches the schema
        working-directory: frontend
        run: |
          npm ci
          npm run protocol:check
