name: Frontend checks
on:
  # Pushes to main only: a branch with a pull request runs the
  # pull_request trigger, and a second push run would duplicate it.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  # Every pull request, with no path filter: main requires this check,
  # and a required check that never starts blocks the merge.
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: frontend
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      # Every browser suite runs on Playwright's own pinned Chromium. The
      # suites honour CHROMIUM_PATH first; without it they would pick up the
      # runner's system chromium, a different build that closed during the
      # sandboxed-preview tests.
      - name: Use Playwright's Chromium
        run: |
          path="$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')"
          echo "browser suites use $path"
          echo "CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - run: npm run test:smoke
      - run: npm run test:agent
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: frontend/artifacts/
