name: Frontend checks
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: frontend
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      # The browser suites use a system `chromium` on PATH when there is one,
      # and Playwright's own build otherwise: say which this runner has.
      - run: command -v chromium chromium-browser || echo "no system chromium, so Playwright's build is used"
      - run: npm run test:e2e
      - run: npm run test:smoke
      - run: npm run test:agent
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: frontend/artifacts/
