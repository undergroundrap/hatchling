# A drop-in for hatchling.service on systemd 254 or later:
# scripts/install.sh installs it at
# /etc/systemd/system/hatchling.service.d/cgroup.conf when systemd has
# DelegateSubgroup.
#
# The service's cgroup is delegated to the broker, which runs in its
# `broker` subgroup and gives each cell a group of its own beside it:
# each cell's processes, memory and CPU are bounded as a whole, and a
# cell that ends is killed whole (cgroup.kill). See the README's "Giving
# Hatchling a cgroup".
[Service]
Delegate=yes
DelegateSubgroup=broker
Environment=HATCHLING_CELL_CGROUP=/sys/fs/cgroup/system.slice/hatchling.service
