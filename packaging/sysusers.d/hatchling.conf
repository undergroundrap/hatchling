# Hatchling's system users, each with a group of its own: what the
# README's quickstart makes with useradd. scripts/install.sh installs this
# at /etc/sysusers.d/hatchling.conf and runs systemd-sysusers.
#
# Nothing else runs as any of them: a process with the cells' uid shares
# their file permissions and process limits.
u hatchling-cell   - "Hatchling: the agent's cells"           /nonexistent /usr/sbin/nologin
u hatchling-broker - "Hatchling: the broker, once started"    /nonexistent /usr/sbin/nologin
u hatchling-keeper - "Hatchling: the vault keeper"            /nonexistent /usr/sbin/nologin
u hatchling-egress - "Hatchling: the egress authority"        /nonexistent /usr/sbin/nologin
