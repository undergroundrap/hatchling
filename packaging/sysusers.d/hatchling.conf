# Hatchling's system users, each with a group of its own: what the
# README's quickstart makes with useradd. scripts/install.sh installs this
# at /etc/sysusers.d/hatchling.conf and runs systemd-sysusers.
#
# Nothing else runs as any of them: a process with the cells' uid shares
# their file permissions and process limits. (A description can't hold a
# colon: passwd separates its fields with one.)
u hatchling-cell   - "Hatchling agent cells"                  /nonexistent /usr/sbin/nologin
u hatchling-broker - "Hatchling broker, once started"         /nonexistent /usr/sbin/nologin
u hatchling-keeper - "Hatchling vault keeper"                 /nonexistent /usr/sbin/nologin
u hatchling-egress - "Hatchling egress authority"             /nonexistent /usr/sbin/nologin
