# Hatchling's state directory, as the README's quickstart makes it:
# searchable by all, for the owner's sockets the broker makes and checks
# in it. scripts/install.sh installs this at /etc/tmpfiles.d/hatchling.conf
# and runs systemd-tmpfiles --create.
#
# Its sock, vault and schedules directories are made once, by the
# installer, and never named here: the broker gives each, at its start, to
# the user that keeps it (the vault to hatchling-keeper), and tmpfiles
# would give them back to root at every boot.
d /var/lib/hatchling 0755 root root -
