[package]
name = "hatchling-goals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Broker-owned goals and tracking store: user-explicit goals, an append-only tracking log, and the read-only feed query interface whose every item carries its provenance."

[lints]
workspace = true

[dependencies]
hatchling-memory.workspace = true
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Safe wrappers over Linux syscalls: getuid for store-root ownership,
# flock to serialize tracking appends across sessions. Keeps the
# workspace-wide `unsafe_code = "deny"` intact.
rustix = { version = "0.38", features = ["fs", "process"] }
