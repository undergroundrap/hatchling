[package]
name = "hatchling-fido2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The FIDO2 transport: CTAP2 over USB HID (hidraw on Linux), as the vault's Authenticator"

[lints]
workspace = true

[dependencies]
# The Authenticator contract this transport implements.
hatchling-vault.workspace = true
# P-256 key agreement for the PIN/UV auth protocols, ES256 signature
# checks, and randomness; already in the tree through rustls.
ring = "0.17"
# AES-256-CBC for the encrypted hmac-secret salt and output and the PIN
# token: the block cipher and the mode, reviewed, never hand-rolled.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
# HKDF (protocol 2's keys), HMAC and SHA-256, as the vault uses them.
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
# poll(2) on the hidraw node, through rustix's safe wrapper.
rustix = { version = "0.38", features = ["event"] }
thiserror = "2"
zeroize = "1"
