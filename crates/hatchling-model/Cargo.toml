[package]
name = "hatchling-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["openai", "ollama", "chat-completions", "agent", "llm"]
categories = ["artificial-intelligence", "api-bindings"]
readme.workspace = true
description = "A real model provider for the agent loop: OpenAI-compatible chat-completions translation behind an injected transport. The crate never opens a socket; the host supplies HTTP through the broker-mediated egress path."

[lints]
workspace = true

[dependencies]
hatchling-loop.workspace = true
hatchling-prompt.workspace = true
thiserror = "2"
serde_json = "1"
# Secrets registered for redaction are zeroized on drop.
zeroize = "1"
# NOTE: endpoint parsing is hand-rolled (see endpoint.rs) instead of the
# `url` crate. The provider only needs scheme/authority/path splitting
# for https URLs, and the workspace's cargo-deny discipline keeps the
# dependency tree minimal.
