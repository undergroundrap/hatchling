[package]
name = "hatchling-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Deep research runs: a phased mode of the agent loop (plan, gather, synthesize, report) with source discipline, citation depth, and bounds."

[lints]
workspace = true

[dependencies]
# The run is a mode of the agent loop: each phase is a bounded loop run.
hatchling-loop.workspace = true
# The authored base prompt, and the untrusted-data envelope every
# gathered source arrives in.
hatchling-prompt.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Each gathered source's content hash.
sha2 = "0.10"
# Fetch times, stated in UTC in the report.
jiff = { version = "0.2.24", default-features = false, features = ["std"] }
thiserror = "2"
