[package]
name = "hatchling-feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["digest", "feed", "provenance", "agent", "llm"]
categories = ["artificial-intelligence"]
readme.workspace = true
description = "The feed: a scheduled digest of the user's own records, read-only, every item an observation with its transitive provenance label."

[lints]
workspace = true

[dependencies]
# The wire spec and the schedule grant vocabulary the feed's reads map to.
hatchling-core.workspace = true
# The read-only query path and the provenance every item carries.
hatchling-goals.workspace = true
# Memory tags, for memory sections.
hatchling-memory.workspace = true
# Times in the digest, stated in UTC.
jiff = { version = "0.2.24", default-features = false, features = ["std"] }
