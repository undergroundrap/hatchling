[package]
name = "hatchling-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Messaging channels for hatchling: the Channel trait and broker-stamped messages; the broker owns the endpoints"
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
hatchling-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Stdin redirection for the stdio-path test of `LocalChannel::receive`.
rustix = { version = "0.38", features = ["pipe", "stdio"] }
