[package]
name = "hatchling-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ipc", "unix-socket", "peer-credentials", "protocol", "agent"]
categories = ["os::unix-apis", "network-programming"]
readme.workspace = true
description = "Shared foundation for hatchling binaries: identity types, protocol framing, and kernel peer credentials"

[lints]
workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"
# Raw SO_PEERCRED reads (pid 0 across pid namespaces is representable).
# The unsafe lives in hatchling-sys, the single sanctioned unsafe crate;
# core stays `unsafe_code = "deny"`.
hatchling-sys.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Standard base64 engine for the secret codec: secrets are arbitrary
# bytes, the wire protocol is framed JSON. One engine, pinned here in
# the contract crate, used by the agent (encode) and the broker (decode).
base64 = "0.22"
# Wipes a secret payload on the wire types when it is dropped.
zeroize = "1"
# JSON Schema derives for the frontend protocol, behind the
# off-by-default `schema` feature: only hatchling-dev's codegen turns it on,
# so no runtime binary compiles it. Reviewed: docs/dependency-review.md
schemars = { version = "1", optional = true, default-features = false, features = ["derive", "std"] }

[features]
# Derive `schemars::JsonSchema` on every wire type, for
# `hatchling-dev protocol-schema`. Off by default.
schema = ["dep:schemars"]
