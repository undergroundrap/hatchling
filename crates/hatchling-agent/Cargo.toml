[package]
name = "hatchling-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm"]
categories = ["artificial-intelligence"]
readme.workspace = true
description = "The agent binary that runs inside a hatchling cell"

[lints]
workspace = true

[dependencies]
hatchling-core.workspace = true
hatchling-loop.workspace = true
hatchling-memory.workspace = true
hatchling-model.workspace = true
# Research runs: the run is a mode of the loop; the agent
# supplies the fetcher, through egress.
hatchling-research.workspace = true
# The agent reaches channels only through the broker session; the channel
# types (Message, ChannelId) are the session's vocabulary.
hatchling-channel.workspace = true
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"

[dev-dependencies]
# Unit and integration tests use the real kernel identity oracle.
rustix = { version = "0.38", features = ["process"] }
# Component tests run the real broker pipeline (peer gate + grant
# mediation) as the agent's counterpart. Dev-only: never linked into
# the runtime.
hatchling-broker = { path = "../hatchling-broker" }
# Goals component tests parse the broker's feed items and check their
# provenance. Dev-only: the agent speaks goals only through the session.
hatchling-goals = { path = "../hatchling-goals" }
# The channel hierarchy test compares the loop's system message against
# the authored prompt pack. Dev-only: the runtime reaches the pack only
# through hatchling-loop.
hatchling-prompt = { path = "../hatchling-prompt" }
# Sealed-vault tests generate the broker's master key directly.
# Dev-only: never linked into the runtime.
hatchling-vault = { path = "../hatchling-vault" }
