[package]
name = "hatchling-artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["artifacts", "provenance", "agent", "llm", "security"]
categories = ["artificial-intelligence", "security"]
readme.workspace = true
description = "The artifact pipeline core: pinned build requests, broker-asserted provenance, the share-review gate, and the single delivery function."

[lints]
workspace = true

[dependencies]
hatchling-core.workspace = true
# Base64 forms of held secrets, so the share-review gate also finds a
# secret a builder encoded before embedding it.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# Builder input and output, and the stored build records.
serde_json = "1"
# Content hashes: pinned inputs, the inputs hash, and the output hash.
sha2 = "0.10"
# Wipes the gate's copies of held secrets, in every form, when it drops them.
zeroize = "1"
