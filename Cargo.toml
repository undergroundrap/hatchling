[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
authors = ["Ocean Bennett"]
repository = "https://github.com/undergroundrap/hatchling"
homepage = "https://oceanbennett.com/hatchling/"
readme = "crates/README.md"

# The crates published to crates.io, at the workspace version. A crate depends
# on another as `name.workspace = true`; dev-dependencies use a bare path, so
# they never block publishing.
[workspace.dependencies]
hatchling-agent = { version = "0.2.0", path = "crates/hatchling-agent" }
hatchling-artifact = { version = "0.2.0", path = "crates/hatchling-artifact" }
hatchling-broker = { version = "0.2.0", path = "crates/hatchling-broker" }
hatchling-channel = { version = "0.2.0", path = "crates/hatchling-channel" }
hatchling-core = { version = "0.2.0", path = "crates/hatchling-core" }
hatchling-egress = { version = "0.2.0", path = "crates/hatchling-egress" }
hatchling-feed = { version = "0.2.0", path = "crates/hatchling-feed" }
hatchling-fido2 = { version = "0.2.0", path = "crates/hatchling-fido2" }
hatchling-goals = { version = "0.2.0", path = "crates/hatchling-goals" }
hatchling-isolation = { version = "0.2.0", path = "crates/hatchling-isolation" }
hatchling-loop = { version = "0.2.0", path = "crates/hatchling-loop" }
hatchling-memory = { version = "0.2.0", path = "crates/hatchling-memory" }
hatchling-model = { version = "0.2.0", path = "crates/hatchling-model" }
hatchling-prompt = { version = "0.2.0", path = "crates/hatchling-prompt" }
hatchling-research = { version = "0.2.0", path = "crates/hatchling-research" }
hatchling-runtime = { version = "0.2.0", path = "crates/hatchling-runtime" }
hatchling-scheduler = { version = "0.2.0", path = "crates/hatchling-scheduler" }
hatchling-skill = { version = "0.2.0", path = "crates/hatchling-skill" }
hatchling-space = { version = "0.2.0", path = "crates/hatchling-space" }
hatchling-sys = { version = "0.2.0", path = "crates/hatchling-sys" }
hatchling-vault = { version = "0.2.0", path = "crates/hatchling-vault" }

# All lint configuration lives here. Every crate sets `lints.workspace = true`.
# There are no per-file `#![allow]`s. A local `#[allow]`/`#[expect]` must name
# its lint and give a `reason = "..."`.
[workspace.lints.rust]
# `unsafe_code` is in the `rust_2018_idioms` group, so the group sits at a
# lower priority and the explicit deny wins.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Restriction lints: hard deny. (Group lints above sit at warn with lower
# priority so these explicit denies always win on overlap.)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
wildcard_enum_match_arm = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
exit = "deny"
mem_forget = "deny"
